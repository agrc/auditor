[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditor"
version = "3.0.4"
description = "Audits all hosted feature service items in a user's AGOL folders for proper tags, sharing, etc based on an external metatable"
license = { text = "MIT" }
authors = [{ name = "Jake Adams", email = "jdadams@utah.gov" }]
requires-python = ">=3.13"
keywords = ["gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
]
dependencies = [
    "docopt==0.6.*",
    "arcgis>=2.4.2,<3",
    "agrc-supervisor==3.0.*",
]

[project.urls]
Homepage = "https://github.com/agrc/auditor"
"Issue Tracker" = "https://github.com/agrc/auditor/issues"

[project.optional-dependencies]
dev = [
    "build",
    "hatchling",
    "pytest-cov>=3,<8",
    "pytest-instafail==0.5.*",
    "pytest-mock>=3.10,<3.16",
    "pytest-runner",
    "pytest-watch==4.*",
    "pytest>=6,<10",
    "ruff==0.*",
]

[project.scripts]
auditor = "auditor.cli:cli"

[tool.hatch.build]
exclude = ["credentials.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.ruff]
line-length = 120
ignore = ["E501"]
[tool.black]
line-length = 120
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src"]
norecursedirs = [".env", "data", "maps", ".github", ".vscode"]
console_output_style = "count"
addopts = "--cov-branch --cov=auditor --cov-report term --cov-report xml:cov.xml --instafail"
